# Watchlist de BotTrading — se sube al repo (no lleva secretos: el chat_id de
# Telegram va siempre en .env / secret de Actions, nunca aquí).
#
# Los precios de los niveles están en USD (la divisa nativa de estos mercados);
# el bot los muestra también en euros al avisar. Direction: "cae" avisa al
# cruzar hacia abajo, "sube" al cruzar hacia arriba.
#
# Cada nivel es UNO de estos dos tipos:
#   price: <número>   — precio fijo (soporte/resistencia de acción del precio,
#                        máximos/mínimos de 52 semanas, niveles psicológicos).
#   ma: sma20|sma50|sma200 — media móvil EN VIVO: se recalcula en cada sondeo
#                        con el precio de ese momento, no se queda congelada.
# Usa "ma" siempre que el nivel realmente sea "cuando recupere/pierda tal
# media" — si se pone como precio fijo, en unas semanas ese número ya no
# coincide con dónde está esa media de verdad.
#
# Niveles definidos el 23-ago-2026 sobre ~1 año de velas diarias (CoinGecko /
# Yahoo Finance) — los de precio fijo hay que revisarlos de vez en cuando
# igualmente (el mercado hace nuevos máximos/mínimos); los de "ma" se
# mantienen solos.

poll_interval: 300      # segundos entre sondeos de precio (5 min)
digest_hour: 9          # hora (Europe/Madrid) del resumen diario por Telegram
mac_alerts: true        # solo tiene efecto en local/macOS
paused: false

assets:
  - symbol: "BTC"
    kind: "crypto"
    source_id: "bitcoin"
    name: "Bitcoin"
    levels:
      - price: 75800
        direction: "cae"
        note: "Soporte inmediato. Si aguanta con rebote, primera señal de continuidad alcista."
      - ma: "sma200"
        direction: "cae"
        note: "Pierde su soporte estructural (SMA/EMA200). Zona de compra SOLO si rebota con volumen desde aquí, no por tocarlo."
      - price: 78400
        direction: "sube"
        note: "Resistencia — máximo reciente (llegó a rozar 79.500 intradía antes de un flash crash)."
      - price: 80000
        direction: "sube"
        note: "Resistencia mayor — entrada en la zona pesada 80-82k. No perseguir con RSI muy alto."

