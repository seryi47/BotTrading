# Watchlist de BotTrading — se sube al repo (no lleva secretos: el chat_id de
# Telegram va siempre en .env / secret de Actions, nunca aquí).
#
# Los precios de los niveles están en USD (la divisa nativa de estos mercados);
# el bot los muestra también en euros al avisar. Direction: "cae" avisa al
# cruzar hacia abajo, "sube" al cruzar hacia arriba.
#
# Cada nivel es UNO de estos dos tipos:
#   price: <número>   — precio fijo (soporte/resistencia de acción del precio,
#                        máximos/mínimos de 52 semanas, niveles psicológicos).
#   ma: sma20|sma50|sma200 — media móvil EN VIVO: se recalcula en cada sondeo
#                        con el precio de ese momento, no se queda congelada.
# Usa "ma" siempre que el nivel realmente sea "cuando recupere/pierda tal
# media" — si se pone como precio fijo, en unas semanas ese número ya no
# coincide con dónde está esa media de verdad.
#
# Niveles definidos el 23-ago-2026 sobre ~1 año de velas diarias (CoinGecko /
# Yahoo Finance) — los de precio fijo hay que revisarlos de vez en cuando
# igualmente (el mercado hace nuevos máximos/mínimos); los de "ma" se
# mantienen solos.

poll_interval: 300      # segundos entre sondeos de precio (5 min)
digest_hour: 9          # hora (Europe/Madrid) del resumen diario por Telegram
mac_alerts: true        # solo tiene efecto en local/macOS
paused: false

assets:
  - symbol: "BTC"
    kind: "crypto"
    source_id: "bitcoin"
    name: "Bitcoin"
    levels:
      - price: 75800
        direction: "cae"
        note: "Soporte inmediato. Si aguanta con rebote, primera señal de continuidad alcista."
      - ma: "sma200"
        direction: "cae"
        note: "Pierde su soporte estructural (SMA/EMA200). Zona de compra SOLO si rebota con volumen desde aquí, no por tocarlo."
      - price: 78400
        direction: "sube"
        note: "Resistencia — máximo reciente (llegó a rozar 79.500 intradía antes de un flash crash)."
      - price: 80000
        direction: "sube"
        note: "Resistencia mayor — entrada en la zona pesada 80-82k. No perseguir con RSI muy alto."

  - symbol: "ETH"
    kind: "crypto"
    source_id: "ethereum"
    name: "Ethereum"
    levels:
      - price: 2360
        direction: "cae"
        note: "Rompe el soporte de 2.400. Si cae con fuerza, siguiente parada 2.100-2.130."
      - price: 2400
        direction: "sube"
        note: "Nivel de decisión. Si aguanta y hace máximo más alto, confirma el primer giro alcista en más de un año."
      - price: 2519
        direction: "sube"
        note: "Rompe el máximo reciente — objetivo intermedio."
      - price: 2800
        direction: "sube"
        note: "Objetivo mayor si la tendencia se confirma."

  - symbol: "MA"
    kind: "stock"
    source_id: "MA"
    name: "Mastercard"
    levels:
      - ma: "sma50"
        direction: "cae"
        note: "Rompe su SMA50 — invalida la estructura alcista limpia. Salir/evitar."
      - ma: "sma20"
        direction: "cae"
        note: "Toca su SMA20 — zona de entrada dentro de la tendencia si rebota."
      - price: 601
        direction: "sube"
        note: "Rompe el máximo de 52 semanas — continuación."

  - symbol: "ORCL"
    kind: "stock"
    source_id: "ORCL"
    name: "Oracle"
    levels:
      - price: 137
        direction: "cae"
        note: "Pierde soporte — riesgo de volver a probar el mínimo de 52 semanas."
      - price: 115
        direction: "cae"
        note: "Test del mínimo de 52 semanas — nivel crítico, muy especulativo."
      - ma: "sma50"
        direction: "sube"
        note: "Rompe su SMA50 — primera confirmación real de rebote tras el -59% desde el ATH."
      - ma: "sma200"
        direction: "sube"
        note: "Recupera su SMA200 — cambiaría la tendencia de fondo, no solo un rebote."

  - symbol: "AOSL"
    kind: "stock"
    source_id: "AOSL"
    name: "Alpha and Omega Semiconductor"
    levels:
      - price: 26
        direction: "cae"
        note: "Pierde el soporte de los mínimos recientes. Sin colchón inmediato: siguiente parada la zona 20-23 (donde consolidó antes del rally), y si eso también cede, el mínimo de 52 semanas."
      - price: 23
        direction: "cae"
        note: "Entra en la zona 20-23 sin colchón — si esto también cede, siguiente parada el mínimo de 52 semanas ($17,5). Aquí la tesis de 'ya tocó fondo' empieza a estar en duda de verdad."
      - price: 17.5
        direction: "cae"
        note: "Test del mínimo de 52 semanas — nivel de capitulación. Si esto falla, la tesis de rebote queda invalidada."
      - ma: "sma200"
        direction: "sube"
        note: "Recupera su SMA200 — primer objetivo del escenario de rebote, antes incluso de la SMA20. Confírmalo con el RSI subiendo de 45-50, no solo con el precio."
      - ma: "sma20"
        direction: "sube"
        note: "Recupera su SMA20 — segundo hito del rebote."
      - ma: "sma50"
        direction: "sube"
        note: "Recupera su SMA50 — confirma el rebote de verdad. Objetivo de analistas más conservador: ~$34 (B. Riley); más optimista: ~$45 (Needham)."

  - symbol: "SONO"
    kind: "stock"
    source_id: "SONO"
    name: "Sonos"
    levels:
      - ma: "sma50"
        direction: "cae"
        note: "Pierde su SMA50 — el impulso de las últimas semanas se agota, vigilar que no siga cayendo."
      - price: 12.44
        direction: "cae"
        note: "Mínimo de 52 semanas — nivel crítico, invalidaría el relato de recuperación."
      - price: 16.59
        direction: "sube"
        note: "Rompe el máximo de las últimas semanas — continuación del tramo alcista reciente."
      - price: 17.52
        direction: "sube"
        note: "Techo recurrente de este año, tocado y rechazado varias veces — romperlo de verdad sería la señal fuerte."
      - price: 19.7
        direction: "sube"
        note: "Iguala el máximo de 52 semanas y el objetivo de consenso de analistas (~$19,67) — objetivo final del escenario alcista."
